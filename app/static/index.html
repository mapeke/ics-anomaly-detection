<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICS Anomaly Detection — External Validation</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>ICS Anomaly Detection</h1>
    <p class="sub">External validation — upload an unseen Morris gas-pipeline file and score it against a trained model artifact.</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Select artifact</h2>
      <label for="artifact">Saved artifact:</label>
      <select id="artifact"></select>
      <div id="artifact-info" class="muted"></div>
    </section>

    <section class="card">
      <h2>2. Pick dataset</h2>
      <form id="score-form">
        <fieldset class="input-source">
          <legend>Input source</legend>
          <label class="inline"><input type="radio" name="source" value="upload" checked /> Upload my own file</label>
          <label class="inline"><input type="radio" name="source" value="bundled" /> Use bundled sample</label>
        </fieldset>
        <div class="row" id="upload-row">
          <label for="file">File:</label>
          <input type="file" id="file" name="file" accept=".arff,.csv,.txt" />
          <span class="muted">.arff or .csv, max 50 MB</span>
        </div>
        <div class="row hidden" id="bundled-row">
          <label for="bundled-dataset">Sample:</label>
          <select id="bundled-dataset" name="bundled_dataset"></select>
          <div id="bundled-info" class="muted"></div>
        </div>
        <button type="submit" id="submit-btn">Score</button>
      </form>
      <div id="status" class="status"></div>
    </section>

    <section id="results" class="card hidden">
      <h2>3. Results</h2>
      <div id="summary"></div>
      <h3>Metrics</h3>
      <div id="metrics"></div>
      <h3>Preview (first 50 rows)</h3>
      <div id="preview"></div>
      <p><a id="download" href="#" download>Download full scores (parquet)</a></p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
